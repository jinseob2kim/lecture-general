<style>
.slide-master-header {
  position: absolute;
  top: 2px;
  right: 0px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
  pointer-events: none;
}
.smh-logo-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72em;
  font-weight: 800;
  color: #2A3D21;
  letter-spacing: 0.1em;
}
.smh-logo-row img {
  height: 40px;
  width: auto;
  background: rgba(255, 255, 255, 0.98);
  border-radius: 999px;
}
.smh-global-footer {
  display: block;
  position: fixed;
  bottom: 21px;
  right: 91px;
  z-index: 2;
  pointer-events: none;
  font-size: 0.45em;
  font-weight: 500;
  color: #999;
  letter-spacing: 0.04em;
  line-height: 1;
}
</style>
<script>
window.__zarathu_fullbg__ = true;
Reveal.on('ready', function() {
  var assetCss = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
    .map(function(link) { return link.getAttribute('href') || ''; })
    .find(function(href) { return href.indexOf('slides_assets/custom-style.css') !== -1; });
  var assetBase = assetCss ? assetCss.replace(/custom-style\.css.*$/, '') : 'slides_assets/';
  var slides = document.querySelectorAll('.reveal .slides > section');
  slides.forEach(function(slide, index) {
    if (index === 0) return;
    if (slide.getAttribute('data-background-color') === '#2A3D21') return;
    var header = document.createElement('div');
    header.className = 'slide-master-header';
    header.innerHTML = '<div class="smh-logo-row"><img src="' + assetBase + 'Zarathu%20Circle%20Clipping%20Mask2.png" alt="">ZARATHU</div>';
    slide.insertBefore(header, slide.firstChild);
  });

  var revealEl = document.querySelector('.reveal');
  var globalFooter = document.createElement('div');
  globalFooter.className = 'smh-global-footer';
  globalFooter.textContent = 'Medical Research Supporters';
  revealEl.appendChild(globalFooter);

  function applyFullBg() {
    var sections = Array.from(document.querySelectorAll('.reveal .slides > section'));
    var backgrounds = Array.from(document.querySelectorAll('.reveal .backgrounds > .slide-background'));
    sections.forEach(function(slide, index) {
      var bg = backgrounds[index];
      if (!bg) return;
      if (index === 0) return;
      if (slide.classList.contains('thankyou-slide')) return;
      if (slide.getAttribute('data-background-color') === '#2A3D21') return;
      bg.style.backgroundImage = "url('" + assetBase + "bg.png')";
      bg.style.backgroundSize = 'cover';
      bg.style.backgroundPosition = 'center';
      bg.style.backgroundRepeat = 'no-repeat';
      bg.style.opacity = '0.12';
    });
  }

  var footerEl = document.querySelector('.reveal .footer');
  var slideNumEl = document.querySelector('.reveal .slide-number');
  function updateFooterVisibility() {
    var indices = Reveal.getIndices();
    var isFirst = (indices.h === 0 && (indices.v === 0 || indices.v === undefined));
    var hide = isFirst;
    if (footerEl) footerEl.style.display = hide ? 'none' : '';
    if (slideNumEl) slideNumEl.style.display = hide ? 'none' : '';
    globalFooter.style.display = hide ? 'none' : '';
  }
  applyFullBg();
  updateFooterVisibility();
  Reveal.on('slidechanged', updateFooterVisibility);
});
</script>
